<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau Périodique des Éléments</title>
  <style>
    :root {
      --background: #e8ecef;
      --ink: #20242a;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--background);
      color: var(--ink);
      margin: 20px;
    }
    h1 { margin: 0 0 18px; font-size: 1.6rem; }
    .table-wrapper { overflow-x: auto; padding-bottom: 8px; }
    .periodic-table {
      display: grid;
      grid-template-columns: repeat(18, minmax(52px, 1fr));
      grid-auto-rows: minmax(62px, auto);
      gap: 5px;
      min-width: 1030px;
    }
    .element {
      border: 1px solid rgba(17, 17, 17, 0.25);
      border-radius: 3px;
      padding: 4px;
      text-align: center;
      color: #111;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .element:hover {
      transform: translateY(-2px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }
    .element strong { display: block; font-size: 1.1rem; }
    .element small { display: block; margin-top: 3px; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 18px;
    }
    .legend span {
      border: 1px solid rgba(17, 17, 17, 0.2);
      border-radius: 3px;
      padding: 6px 9px;
      font-size: 0.85rem;
    }
    .info {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid #c9ced3;
      border-radius: 4px;
      padding: 14px 16px;
      min-height: 70px;
      line-height: 1.55;
    }
  </style>
</head>
