<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résonance d'un oscillateur masse-ressort</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 20px;
        }
        h2 {
            text-align: center;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        canvas {
            background: white;
            border: 1px solid #bbb;
            border-radius: 10px;
        }
        .controls {
            text-align: center;
            margin-top: 15px;
        }
        .control-group {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        span {
            display: inline-block;
            width: 50px;
            text-align: left;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.paused {
            background-color: #28a745;
        }
        button.paused:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h2>Résonance d'un système masse-ressort</h2>

    <div class="container">
        <canvas id="simu" width="400" height="450"></canvas>
        <canvas id="resonance" width="450" height="450"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>ω / ω₀ (Fréquence)</label>
            <input type="range" id="freq" min="0.1" max="2.5" step="0.01" value="1.00">
            <span id="freqVal">1.00</span>
        </div>
        <div class="control-group">
            <!-- Valeur minimale relevée à 0.04 pour éviter que la masse ne sorte de l'écran à la résonance -->
            <label>ζ (Amortissement)</label>
            <input type="range" id="damping" min="0.04" max="0.30" step="0.01" value="0.06">
            <span id="dampVal">0.06</span>
        </div>
        <p>
            <strong>Amplification théorique :</strong> <span id="gain">0</span>
        </p>
        <button id="playPauseBtn">Pause</button>
    </div>

<script>
// ---------- PARAMÈTRES PHYSIQUES ----------
const w0 = 1.0;
let x = 0;
let v = 0;
let t = 0;
const dt = 0.02;
const excitationAmplitude = 20;

// ---------- ÉTAT DE L'ANIMATION ----------
let isPlaying = true;
let animationId = null;
let mustRedrawCurve = true; // Flag pour optimiser le calcul de la courbe verte

// ---------- CANVAS ----------
const canvas = document.getElementById("simu");
const ctx = canvas.getContext("2d");
const rCanvas = document.getElementById("resonance");
const rctx = rCanvas.getContext("2d");

// ---------- CONTRÔLES ----------
const freqSlider = document.getElementById("freq");
const dampSlider = document.getElementById("damping");
const freqVal = document.getElementById("freqVal");
const dampVal = document.getElementById("dampVal");
const gainLabel = document.getElementById("gain");
const playPauseBtn = document.getElementById("playPauseBtn");

// ---------- HISTORIQUE ----------
let trace = [];

// ---------- FONCTIONS MATHÉMATIQUES ----------
function amplification(r, zeta) {
    const numerateur = Math.sqrt(1 + Math.pow(2 * zeta * r, 2));
    const denominateur = Math.sqrt(Math.pow(1 - r * r, 2) + Math.pow(2 * zeta * r, 2));
    return numerateur / denominateur;
}

// ---------- ÉVÉNEMENTS (OPTIMISATION) ----------
// On ne recalcule la courbe verte QUE si l'amortissement change
dampSlider.addEventListener('input', () => {
    mustRedrawCurve = true;
    if (!isPlaying) drawFrame(); // Met à jour l'image même en pause
});

// La fréquence ne change pas la courbe verte, elle déplace juste la barre rouge
freqSlider.addEventListener('input', () => {
    if (!isPlaying) drawFrame(); // Met à jour l'image même en pause
});

// Gestion du bouton Pause / Lecture
playPauseBtn.addEventListener('click', () => {
    isPlaying = !isPlaying;
    if (isPlaying) {
        playPauseBtn.textContent = "Pause";
        playPauseBtn.classList.remove("paused");
        animate();
    } else {
        playPauseBtn.textContent = "Reprendre";
        playPauseBtn.classList.add("paused");
        cancelAnimationFrame(animationId);
    }
});

// ---------- DESSIN RESSORT ----------
function drawSpring(x1, y1, x2, y2, n) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    let dy = (y2 - y1) / (n + 1);
    for (let i = 1; i <= n; i++) {
        let xx = (i % 2 === 0) ? x1 + 15 : x1 - 15;
        let yy = y1 + i * dy;
        ctx.lineTo(xx, yy);
    }
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.stroke();
}

// ---------- GRAPHE HISTORIQUE ----------
function drawHistory() {
    const ox = 20;
    const oy = 370;
    const W = 360;
    const H = 60;
    ctx.strokeStyle = "#cccccc";
    ctx.strokeRect(ox, oy, W, H);
    
    ctx.beginPath();
    trace.forEach((value, i) => {
        let X = ox + i;
        let Y = oy + H / 2 - value * 0.6;
        if (i === 0) ctx.moveTo(X, Y);
        else ctx.lineTo(X, Y);
    });
    ctx.strokeStyle = "royalblue";
    ctx.stroke();
}

// ---------- PHYSIQUE (MOTEUR) ----------
function updatePhysics() {
    const r = parseFloat(freqSlider.value);
    const zeta = parseFloat(dampSlider.value);
    const w = r * w0;
    
    let y = excitationAmplitude * Math.sin(w * t);
    let dy_dt = excitationAmplitude * w * Math.cos(w * t); 
    
    let a = -w0 * w0 * (x - y) - 2 * zeta * w0 * (v - dy_dt);
    
    v += a * dt;
    x += v * dt;
    t += dt;
    
    trace.push(x);
    if (trace.length > 360) trace.shift();
    
    return { r, zeta, y };
}

// ---------- DESSIN SIMULATION ----------
function drawSimulation(data) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const anchorX = 200;
    const anchorY = 90 + data.y;
    const massY = 230 + x;

    ctx.fillStyle = "#777";
    ctx.fillRect(120, 40, 160, 12);
    
    ctx.fillStyle = "#ff4444";
    ctx.fillRect(anchorX - 30, anchorY - 6, 60, 12);
    
    drawSpring(anchorX, anchorY + 6, anchorX, massY, 12);
    
    ctx.beginPath();
    ctx.arc(anchorX, massY + 25, 20, 0, Math.PI * 2);
    ctx.fillStyle = "steelblue";
    ctx.fill();

    ctx.fillStyle = "black";
    ctx.font = "14px Arial";
    ctx.fillText("Support mobile", anchorX + 40, anchorY + 5);
    ctx.fillText("Masse", anchorX + 30, massY + 30);
    
    drawHistory();
}

// ---------- COURBE DE RÉSONANCE (OPTIMISÉE) ----------
// On crée un canvas invisible en mémoire pour stocker la courbe verte
const curveCacheCanvas = document.createElement("canvas");
curveCacheCanvas.width = 450;
curveCacheCanvas.height = 450;
const cacheCtx = curveCacheCanvas.getContext("2d");

function drawResonance(r, zeta) {
    const ox = 60;
    const oy = 400;
    const W = 340;
    const H = 300;

    // 1. Recalculer la courbe verte UNIQUEMENT si l'amortissement (zeta) change
    if (mustRedrawCurve) {
        cacheCtx.clearRect(0, 0, 450, 450);
        
        // Cadre du graphique en arrière-plan
        cacheCtx.strokeStyle = "#888";
        cacheCtx.strokeRect(ox, oy - H, W, H);
        
        // Dessin de la courbe théorique
        cacheCtx.beginPath();
        for (let i = 0; i <= 500; i++) {
            let rr = 0.01 + i * (2.5 / 500);
            let amp = amplification(rr, zeta);
            
            let X = ox + rr * (W / 2.5);
            let Y = oy - amp * (H / 6); 
            
            if (i === 0) cacheCtx.moveTo(X, Y);
            else if (Y >= oy - H) cacheCtx.lineTo(X, Y);
        }
        cacheCtx.strokeStyle = "green";
        cacheCtx.lineWidth = 2;
        cacheCtx.stroke();
        
        mustRedrawCurve = false; // Le cache est à jour
    }

    // 2. Affichage à l'écran
    rctx.clearRect(0, 0, rCanvas.width, rCanvas.height);
    
    // On colle l'image de la courbe pré-calculée (ultra rapide)
    rctx.drawImage(curveCacheCanvas, 0, 0);

    // 3. Dessiner la ligne rouge (Fréquence actuelle) par-dessus
    let xr = ox + r * (W / 2.5);
    rctx.beginPath();
    rctx.moveTo(xr, oy);
    rctx.lineTo(xr, oy - H);
    rctx.strokeStyle = "red";
    rctx.lineWidth = 1;
    rctx.stroke();

    // Légendes
    rctx.fillStyle = "black";
    rctx.font = "14px Arial";
    rctx.fillText("Gain (Amplitude / Support)", 10, 40);
    rctx.fillText("Fréquence réduite (ω/ω₀)", 260, 430);
}

// ---------- MISE À JOUR UNIQUE DE L'ÉCRAN ----------
function drawFrame() {
    const r = parseFloat(freqSlider.value);
    const zeta = parseFloat(dampSlider.value);
    const gain = amplification(r, zeta);
    
    freqVal.textContent = r.toFixed(2);
    dampVal.textContent = zeta.toFixed(2);
    gainLabel.textContent = gain.toFixed(2);
    
    // En pause, on simule une excitation immobile à l'instant t actuel
    const w = r * w0;
    let y = excitationAmplitude * Math.sin(w * t);
    
    drawSimulation({ r, zeta, y });
    drawResonance(r, zeta);
}

// ---------- BOUCLE D'ANIMATION PRINCIPALE ----------
function animate() {
    if (!isPlaying) return;

    let data = updatePhysics();
    const gain = amplification(data.r, data.zeta);
    
    freqVal.textContent = data.r.toFixed(2);
    dampVal.textContent = data.zeta.toFixed(2);
    gainLabel.textContent = gain.toFixed(2);
    
    drawSimulation(data);
    drawResonance(data.r, data.zeta);
    
    animationId = requestAnimationFrame(animate);
}

// Initialisation au démarrage
drawFrame();
animate();
</script>
</body>
</html>
